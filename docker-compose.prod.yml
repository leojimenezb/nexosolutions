services:
  web:
    build:
      context: .
      dockerfile: docker/astro/Dockerfile.prod
      args:
        PUBLIC_SITE_URL: https://nexosolutions.online
        PUBLIC_SITE_NAME: NEXO Soluciones
        PUBLIC_SITE_TAGLINE: Tecnología que impulsa tu negocio
        PUBLIC_SITE_DESCRIPTION: Ayudamos a emprendedores y pequeñas empresas mediante soluciones tecnológicas
        PUBLIC_COMPANY_NAME: NEXO Soluciones
        PUBLIC_COMPANY_ADDRESS: Ciudad de México, México
        PUBLIC_CONTACT_PHONE: 5523532259
        PUBLIC_CONTACT_EMAIL: contacto@nexosoluciones.com
        PUBLIC_WHATSAPP_NUMBER: 525523532259
        PUBLIC_FACEBOOK_URL: https://facebook.com/nexosoluciones
        PUBLIC_INSTAGRAM_URL: https://instagram.com/nexosoluciones
        PUBLIC_LINKEDIN_URL: https://linkedin.com/company/nexosoluciones
        PUBLIC_TWITTER_URL: https://twitter.com/nexosoluciones
        PUBLIC_SITE_KEYWORDS: desarrollo web, automatización, soporte tecnológico
        PUBLIC_SITE_AUTHOR: NEXO Soluciones

    container_name: nexo-web-prod

    ports:
      - "4321:4321"
      - "4322:4322"

    environment:
      NODE_ENV: production
      PUBLIC_SITE_URL: https://nexosolutions.online
      PUBLIC_SITE_NAME: NEXO Soluciones
      PUBLIC_SITE_TAGLINE: Tecnología que impulsa tu negocio
      PUBLIC_SITE_DESCRIPTION: Ayudamos a emprendedores y pequeñas empresas mediante soluciones tecnológicas
      PUBLIC_COMPANY_NAME: NEXO Soluciones
      PUBLIC_COMPANY_ADDRESS: Ciudad de México, México
      PUBLIC_CONTACT_PHONE: 5523532259
      PUBLIC_CONTACT_EMAIL: contacto@nexosoluciones.com
      PUBLIC_WHATSAPP_NUMBER: 525523532259
      PUBLIC_FACEBOOK_URL: https://facebook.com/nexosoluciones
      PUBLIC_INSTAGRAM_URL: https://instagram.com/nexosoluciones
      PUBLIC_LINKEDIN_URL: https://linkedin.com/company/nexosoluciones
      PUBLIC_TWITTER_URL: https://twitter.com/nexosoluciones
      PUBLIC_SITE_KEYWORDS: desarrollo web, automatización, soporte tecnológico
      PUBLIC_SITE_AUTHOR: NEXO Soluciones

    restart: unless-stopped