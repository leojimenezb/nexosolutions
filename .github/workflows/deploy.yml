name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with production variables
        run: |
          PUBLIC_SITE_URL=${{ secrets.GITHUB_PAGES_URL || 'https://tu-usuario.github.io/nexosolutions' }} \
          PUBLIC_BASE_PATH=${{ secrets.GITHUB_BASE_PATH || '/nexosolutions' }} \
          PUBLIC_SITE_NAME=NEXO Soluciones \
          PUBLIC_SITE_TAGLINE="Tecnología que impulsa tu negocio" \
          PUBLIC_SITE_DESCRIPTION="Ayudamos a emprendedores y pequeñas empresas mediante soluciones tecnológicas" \
          PUBLIC_COMPANY_NAME=NEXO Soluciones \
          PUBLIC_COMPANY_ADDRESS="Ciudad de México, México" \
          PUBLIC_CONTACT_PHONE=5523532259 \
          PUBLIC_CONTACT_EMAIL=contacto@nexosoluciones.com \
          PUBLIC_WHATSAPP_NUMBER=525523532259 \
          PUBLIC_FACEBOOK_URL=https://facebook.com/nexosoluciones \
          PUBLIC_INSTAGRAM_URL=https://instagram.com/nexosoluciones \
          PUBLIC_LINKEDIN_URL=https://linkedin.com/company/nexosoluciones \
          PUBLIC_TWITTER_URL=https://twitter.com/nexosoluciones \
          PUBLIC_SITE_KEYWORDS="desarrollo web, automatización, soporte tecnológico" \
          PUBLIC_SITE_AUTHOR=NEXO Soluciones \
          npm run build

      - name: Copy .htaccess
        run: cp .htaccess dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4